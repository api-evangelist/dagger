aid: dagger
name: Dagger
kind: opensource
description: >-
  Dagger is an open-source programmable CI/CD engine that runs pipelines
  in containers using a unified, introspectable GraphQL API. Pipelines
  are written as code in the developer's preferred language (Go, Python,
  TypeScript, PHP, Java, .NET, Elixir, or Rust) using Dagger SDKs and
  packaged as Dagger Modules that can be published to the Daggerverse
  module index. The Dagger Engine exposes Container, Directory, File,
  Secret, and CacheVolume as first-class GraphQL types backed by a
  content-addressed store, enabling deterministic builds and aggressive
  caching. Dagger Cloud provides the hosted control plane for
  pipeline traces, checks, and module observability. Dagger does not
  expose a public REST API; clients connect to a per-session Dagger
  Engine GraphQL endpoint and the optional Dagger Cloud Web UI.
