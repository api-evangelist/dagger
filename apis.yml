apis:
- aid: dagger:graphql
  name: Dagger Engine GraphQL API
  description: >-
    The Dagger Engine exposes a unified, introspectable GraphQL type system at a per-session endpoint.
    The schema includes Container, Directory, File, Secret, CacheVolume, and other first-class types and
    is dynamically extended at runtime by loaded Dagger Modules. All Dagger SDKs (Go, Python, TypeScript,
    PHP, Java, .NET, Elixir, Rust) are generated against this schema. There is no publicly-hosted REST
    endpoint.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.dagger.io/api/
  baseURL: http://127.0.0.1:{DAGGER_SESSION_PORT}
  baseURLNote: >-
    Templated and correct. Dagger publishes no hosted API host; the engine serves its GraphQL API on loopback
    at http://127.0.0.1:$DAGGER_SESSION_PORT/query for the life of one `dagger run` session, authenticated
    with DAGGER_SESSION_TOKEN over HTTP Basic. Verified 2026-09-07 against https://docs.dagger.io/0.21/getting-started/api/http/
  tags:
  - GraphQL
  - Introspection
  - Modules
  - SDK
  properties:
  - type: Documentation
    url: https://docs.dagger.io/api/
  - type: APIReference
    url: https://docs.dagger.io/reference/
  - type: APIInternals
    url: https://docs.dagger.io/api/internals/
  - type: Blog
    url: https://dagger.io/blog/graphql
  - type: GraphQL
    url: graphql/dagger-schema.graphqls
  - type: GraphQLSchema
    url: graphql/dagger-graphql-schema.yml
  - type: GettingStarted
    url: https://docs.dagger.io/0.21/getting-started/api/http/
- aid: dagger:sdks
  name: Dagger SDKs
  description: >-
    Native SDKs for Go, Python, TypeScript, PHP, Java, .NET, Elixir, and Rust that generate strongly typed
    clients against the Dagger Engine's GraphQL schema, allowing pipelines to be written as regular code
    in the developer's preferred language.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.dagger.io/api/clients
  baseURL: http://127.0.0.1:{DAGGER_SESSION_PORT}
  baseURLNote: >-
    Every Dagger SDK is a generated client for the same per-session loopback endpoint the engine serves;
    there is no separate SDK host.
  tags:
  - .NET
  - Elixir
  - Go
  - Java
  - PHP
  - Python
  - Rust
  - SDK
  - TypeScript
  tags_raw:
  - .NET
  - Elixir
  - Go
  - Java
  - PHP
  - Python
  - Rust
  - SDKs
  - TypeScript
  properties:
  - type: Documentation
    url: https://docs.dagger.io/api/clients
  - type: GitHubRepository
    url: https://github.com/dagger/dagger
  - type: Packages
    url: packages/dagger-packages.yml
  - type: SDKs
    url: packages/dagger-packages.yml
- aid: dagger:daggerverse
  name: Daggerverse Module Index
  description: >-
    Daggerverse is the free, public index of Dagger Modules. Developers search for, browse, and consume
    reusable Modules contributed by the Dagger community.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://daggerverse.dev/
  baseURL: https://daggerverse.dev/
  baseURLNote: >-
    Daggerverse publishes no machine-readable API. Probed 2026-09-07: /api, /api/modules, /api/search
    and /graphql all return 404, and api.daggerverse.dev does not resolve. The module index is consumed
    through `dagger search` / `dagger install` against git refs, not over HTTP by third parties, so the
    site root is recorded as the only host — a human surface, not an API base.
  tags:
  - Daggerverse
  - Modules
  - Registry
  properties:
  - type: Website
    url: https://daggerverse.dev/
  - type: GettingStarted
    url: https://docs.dagger.io/ci/quickstart/simplify/
- aid: dagger:cloud
  name: Dagger Cloud
  description: >-
    Dagger Cloud is the hosted control plane providing pipeline traces, checks, module observability,
    and team collaboration. It integrates with the local Dagger Engine for seamless trace uploads.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dagger.io/cloud
  baseURL: https://api.dagger.cloud
  baseURLNote: >-
    Real, first-party and reachable, but undocumented. api.dagger.cloud answers from a Go HTTP server
    (plain-text "404 page not found" on unknown paths, not an SPA shell) and serves two real documents
    anonymously: /.well-known/openid-configuration (issuer https://api.dagger.cloud) and /jwks. No API
    reference for it is published — Dagger Cloud is documented as a product, not as an API. Probed 2026-09-07.
  tags:
  - Cloud
  - Observability
  - Telemetry
  - Traces
  properties:
  - type: Website
    url: https://dagger.io/cloud
  - type: Signup
    url: https://dagger.cloud
