name: Dagger GraphQL API Capabilities
description: >-
  Capability profile for the Dagger Engine's GraphQL API and Module
  System. The Dagger Engine exposes a unified, introspectable GraphQL
  type system that is dynamically extended at runtime by Dagger
  Modules. SDKs in Go, Python, TypeScript, PHP, Java, .NET, Elixir,
  and Rust generate strongly typed clients from this schema. There is
  no public REST API; clients connect to a per-session Dagger Engine
  endpoint.
modified: '2026-04-28'
api: dagger-graphql
capabilities:
  - id: introspect-schema
    name: Introspect GraphQL Schema
    description: Query the Dagger Engine's GraphQL schema (including dynamically loaded modules) via standard GraphQL introspection.
    operations:
      - POST /query (GraphQL introspection)
  - id: build-container
    name: Build and Run Containers
    description: Construct OCI containers programmatically (from base image, Dockerfile, or step composition), run commands, and capture artifacts.
    operations:
      - GraphQL Container.from
      - GraphQL Container.withExec
      - GraphQL Container.withDirectory
      - GraphQL Container.publish
  - id: directory-operations
    name: Directory and File Operations
    description: Read and write directory and file content as first-class GraphQL types backed by the Dagger Engine's content-addressed store.
    operations:
      - GraphQL Directory.entries
      - GraphQL Directory.withFile
      - GraphQL Directory.export
      - GraphQL File.contents
  - id: module-system
    name: Module System and Daggerverse
    description: Load, execute, and publish reusable Dagger Modules; discover them on the Daggerverse module index.
    operations:
      - dagger call
      - dagger functions
      - dagger publish
  - id: cloud-traces
    name: Dagger Cloud Traces
    description: View pipeline traces, checks, and module execution telemetry in the Dagger Cloud control plane.
    operations:
      - Dagger Cloud Web UI
  - id: cli
    name: Dagger CLI
    description: dagger CLI introspects modules' GraphQL APIs and exposes their functions as subcommands and flags.
    operations:
      - dagger init
      - dagger develop
      - dagger call
      - dagger functions
      - dagger run
