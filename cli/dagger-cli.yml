name: dagger
description: >-
  The Dagger CLI is the primary human and CI entry point to the engine. It starts
  a session, installs and runs modules, exposes the GraphQL API, and shells out to
  Dagger Cloud. It is not a thin wrapper over a REST API — it is how the engine is
  driven.
docs: https://docs.dagger.io/cli/reference/
install:
- method: script
  platforms: [macOS, Linux]
  command: >-
    curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=1.0.0-beta.11 BIN_DIR=/usr/local/bin sh
  note: Verbatim from https://docs.dagger.io/cli/install
- method: script
  platforms: [Windows]
  command: >-
    iwr -useb https://dl.dagger.io/dagger/install.ps1 | iex; Install-Dagger -DaggerVersion 1.0.0-beta.11 -AddToPath
  note: PowerShell 7+. Verbatim from https://docs.dagger.io/cli/install
- method: homebrew
  platforms: [macOS]
  command: brew install dagger/tap/dagger
  tap: https://github.com/dagger/homebrew-tap
- method: winget
  platforms: [Windows]
  command: winget install Dagger.Cli
- method: nix
  platforms: [Linux, macOS]
  repo: https://github.com/dagger/nix
  note: >-
    The org publishes a nix repo; the exact flake invocation is not quoted here
    because the install page does not state one.
version_pinning:
  note: >-
    "Homebrew and winget carry the latest stable release only, which may differ
    from the version this documentation covers." A specific engine release can be
    selected with `export DAGGER_X_RELEASE=v1.0.0-beta.11` or the flag
    `--x-release=v1.0.0-beta.11`.
  finding: >-
    The current docs install DAGGER_VERSION=1.0.0-beta.11 while the GitHub release
    train's latest tag is v0.21.9 (2026-08-26). Two lines are live at once — the
    0.21.x stable engine and the 1.0.0-beta.N line the docs now target. A
    consumer following the install page does not get the version the Releases
    page calls latest.
