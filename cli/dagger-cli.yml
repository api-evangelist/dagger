key_flows:
- name: Call the API directly
  steps:
  - dagger api
  note: >-
    Equivalent to POSTing to http://127.0.0.1:$DAGGER_SESSION_PORT/query with the
    session token; see skills/.
- name: Adopt a community module
  steps:
  - dagger search <term>
  - dagger install <module ref>
  - dagger installed
- name: Run project checks
  steps:
  - dagger check
  note: Cloud Checks (dagger.io/changelog, early access) triggers this on git events.
