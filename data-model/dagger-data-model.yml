model_kind: graphql-object-graph
shape_note: >-
  This is not a record model. Dagger's types are IMMUTABLE VALUES in a build
  graph, not rows in a store — there is no create/read/update/delete and no
  identity that survives a mutation. Every `with*` field is a pure transformation
  returning a NEW value of the same type, so relationships below mean "this type
  can produce or expose that type", not "this record owns that record". Reading
  it as a CRUD ERD produces wrong integrations, which is why the relationship
  verbs used are produces / exposes / lists rather than has_one / has_many.
identifiers:
  scheme: content-addressed opaque IDs
  note: >-
    Since v0.21.1 objects are exposed through a standard Node interface and a
    unified ID scalar (CHANGELOG.md, PR #12041). IDs are content-addressed
    handles, not durable primary keys, and each type has a matching
    Query.load<Type>FromID resolver. Identical inputs yield the same ID, which is
    what drives the cache.
  id_prefixes: none
  id_prefix_note: >-
    Dagger publishes no per-object id-prefix convention (no obj_/cus_ style
    scheme). Checked the object reference and the SDL; there is none to record.
