surfaces:
  openapi:
    path: openapi/dagger-graphql-api-openapi.yml
    operations: 2
    gated: false
    note: >-
      Not a resource API. The whole REST surface is one GraphQL transport endpoint
      (POST /query, plus a GET variant). operationIds executeGraphQLQuery and
      executeGraphQLQueryViaGet are added by overlays/dagger-graphql-api-overlay.yaml;
      the source spec ships none.
  graphql:
    endpoint: http://127.0.0.1:{DAGGER_SESSION_PORT}/query
    sdl: graphql/dagger-schema.graphqls
    gated: true
    note: >-
      Not gated by a vendor login — gated by locality. The endpoint only exists
      inside a running `dagger run` session on the caller's own machine and is
      protected by HTTP Basic with DAGGER_SESSION_TOKEN. The SDL is published, so
      the schema is fully readable without a session.
  mcp:
    url: null
    mode: local-stdio
    install: container-use stdio
    gated: false
    note: No remote MCP URL exists; the server is a local binary.
binding_model: >-
  container-use does not proxy GraphQL operations one-for-one. Each MCP tool is a
  composite that drives the Dagger engine over the SDK (Go), usually touching
  several GraphQL fields, and additionally performs git work (branch, commit, push
  to a container-use/<id> ref) that has no GraphQL counterpart at all. Every row
  below therefore binds a tool to the GraphQL fields it exercises, and to the one
  REST transport operation those fields travel over. Confidence is set by how
  directly the tool maps onto named schema fields, and no row claims a
  field-for-tool identity that the source does not show.
