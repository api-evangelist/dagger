graphql_only_note: >-
  The overwhelming majority of the schema is not reachable through container-use.
  The SDL carries 84 object types (Container, Directory, File, Secret,
  CacheVolume, Git*, LLM, Agent, Check, Module, Workspace, Engine, Cloud and more)
  and container-use exposes 15 tools that touch a narrow slice of Container,
  Directory, File and Service. Anything else — modules, checks, agents, the LLM
  type, engine cache introspection — is reachable only by writing a Dagger module
  or calling the engine directly.
