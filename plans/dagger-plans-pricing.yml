specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Dagger
providerId: dagger
generated: '2026-09-07'
method: searched
source: https://dagger.io/pricing
created: '2026-05-04'
modified: '2026-09-07'
supersedes: >-
  This file previously held a bulk-sweep scaffold dated 2026-05-04 with invented
  "Free / Professional" tiers and invented request quotas (1,000/month, 10 rpm).
  Those values were never published by Dagger. Replaced 2026-09-07 with the tiers
  read off https://dagger.io/pricing.
description: >-
  Dagger Cloud pricing. The Dagger Engine, the SDKs, the CLI and the Daggerverse
  module index are open source (Apache-2.0) and free — nothing on the pricing page
  meters them. What is priced is the hosted control plane: traces, run history,
  module insights and the module catalog, metered in "Monthly Events" and seats.
  Both paid-adjacent tiers are labelled "early access plan" on the page.
billing_unit: Monthly Events
plan_count: 3
plans:
- id: dagger-individual
  name: Individual
  label_on_page: early access plan
  type: free
  price: '0'
  currency: USD
  period: month
  tagline: Observability for one.
  limits:
    users: 1
    monthly_events: 1000000
    run_history: 1 month
  included:
  - Workflow/Function logs
  - Function call traces
  - Workflow cache visibility
  - Pre-push visibility
  - Github Checks integration
  excluded:
  - Centralized telemetry service
  - Module Insights
  - Module Catalog
  - SSO
  - Managed single-tenant deployment
  support: Community support
  overage: not published
- id: dagger-team
  name: Team
  label_on_page: early access plan
  type: paid
  price: '50'
  currency: USD
  period: month
  price_note: $50 per month (after 2 week trial)
  trial: 2 weeks
  tagline: Observability and module sharing for up to 10 users
  limits:
    users: 10
    monthly_events: 10000000
    run_history: 1 year
  included:
  - Workflow/Function logs
  - Function call traces
  - Workflow cache visibility
  - Pre-push visibility
  - Module Insights
  - Module Catalog
  - Github Checks integration
  coming_soon:
  - Centralized telemetry service
  excluded:
  - SSO
  - Managed single-tenant deployment
  support: Email support
  overage: not published
- id: dagger-enterprise
  name: Enterprise
  type: custom
  price: Custom
  currency: USD
  period: null
  tagline: Enterprise-level confidence and support for teams running Dagger at scale.
  limits:
    users: contact us
    monthly_events: contact us
    run_history: contact us
  included:
  - Module Insights
  - Module Catalog
  - SSO
  - Managed single-tenant deployment
  support: 24/7 premium support
  overage: not published
  cta: Contact us
free_tier: true
open_source_note: >-
  The engine itself is Apache-2.0 (https://github.com/dagger/dagger/blob/main/LICENSE)
  and self-hostable; Daggerverse (https://daggerverse.dev/) is described by Dagger
  as the free, public module index. A team can run all of Dagger's automation
  capability without ever entering this pricing table.
findings:
- >-
  No overage pricing is published for either metered tier. A team that exceeds
  10,000,000 monthly events on the Team plan cannot tell from the page what
  happens next.
- >-
  Both non-enterprise tiers still carry the "early access plan" label, so the
  pricing is not presented as settled.
